<!doctype html>
<!-- HTML5 Document Type Declaration - Defines this as an HTML5 document -->
<html lang="en">
  <!-- Document head containing metadata and external resource links -->
  <head>
    <!-- Character encoding for the document -->
    <meta charset="UTF-8" />

    <!-- Viewport meta tag for responsive design on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Page title displayed in browser tab -->
    <title>FinBuddy - Smart Finance Assistant</title>

    <!-- SEO meta description for search engines -->
    <meta name="description" content="FinBuddy - Your AI-powered personal finance assistant" />

    <!-- Author meta tag for attribution -->
    <meta name="author" content="FinBuddy" />

    <!-- Open Graph meta tags for social media sharing (Facebook, LinkedIn, etc.) -->
    <meta property="og:title" content="FinBuddy - Smart Finance Assistant" />
    <meta property="og:description" content="Track expenses, manage budgets, and get AI-powered financial insights" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card meta tags for Twitter sharing -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@FinBuddy" />
  </head>

  <!-- Main document body -->
  <body>
    <!-- Root div where the React application will be mounted -->
    <div id="root"></div>

    <!-- Main application script - loads and initializes the React app -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
